description = "Explains how code really works, with file:line evidence"
prompt = """
Explain how target really works: {{args}}.
Execution discipline: Inspect entry points -> state engine -> primary operation end-to-end -> boundary contracts.
Calibrate scale dynamically: Macro (subsystems & core state engine) vs Module (line-level trace) vs Delta (diff review).
Deliver the sections in a single turn without conversational filler:
1. Topology & Core State Engine (ASCII flow diagram, subsystem map, external state)
2. Primary Execution Path Trace (numbered call path with file:line, state mutations, async boundaries, resource disposal)
3. Decisions & Contracts (design choices vs alternatives not taken, upstream contracts)
4. Failure Modes (nominal path, interrupted/exceptional path, concurrency & re-entrancy at state level)
5. Spec vs. Implementation Audit (documented claims vs code reality, hidden runtime costs)
Cite file:line. Tag claims as [VERIFIED] or [INFERRED]. Avoid empty qualifiers.
"""
